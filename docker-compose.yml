services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000", "--dir", "/data"]
    ports:
      - "6379:6379"
    networks:
      - app
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    # Pulls the image from your registry. Set IMAGE in .env on the server,
    # e.g. IMAGE=localhost:5000/elsewhere:latest (see .env.example).
    image: ${IMAGE:-elsewhere:latest}
    ports:
      - "3001:3000"
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backups:/app/backups
    networks:
      - web
      - app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:

networks:
  web:
    external: true
  app:
    driver: bridge